name: DB - Seed Database (one-time)

# Manual trigger only. Safe to accidentally run more than once - the seed
# script checks whether shuttle-bus-ticketing_db.users already exists and skips the
# import if so, rather than failing on duplicate-key errors from schema.sql's
# seed INSERTs.
on:
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  APP_TAG: assignment-shuttle-bus-ticketing
  SCHEMA_KEY: db-init/schema.sql
  SCRIPT_KEY: db-init/seed-db.sh

jobs:
  seed:
    name: Seed RDS from schema.sql
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AWS Academy Learner Lab credentials expire every ~3-4 hours and rotate
      # per session - refresh these 3 repo secrets before running this workflow.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Resolve the bucket name from Terraform state rather than hardcoding it,
      # so it stays in sync with the account-ID-suffixed name Terraform created.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Resolve S3 bucket from Terraform output
        working-directory: infra/envs/sandbox
        run: |
          terraform init -input=false
          echo "SCHEMA_BUCKET=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_ENV"

      - name: Upload schema.sql, seed script, and sample images to S3
        run: |
          aws s3 cp shuttle-bus-ticketing/schema.sql "s3://${{ env.SCHEMA_BUCKET }}/${{ env.SCHEMA_KEY }}"
          aws s3 cp infra/scripts/seed-db.sh "s3://${{ env.SCHEMA_BUCKET }}/${{ env.SCRIPT_KEY }}"
          # Upload sample event images with long-term immutable Cache-Control so browsers cache them locally
          aws s3 sync shuttle-bus-ticketing/uploads/ "s3://${{ env.SCHEMA_BUCKET }}/uploads/" \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Run seed script on a running app instance via SSM
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:App,Values=${{ env.APP_TAG }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text 2>/dev/null || echo "")

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "No running app instance found - apply infra and wait for at least one healthy instance first."
            exit 1
          fi

          echo "Found running instance: $INSTANCE_ID. Waiting for SSM Agent registration..."
          SSM_ONLINE=false
          for i in $(seq 1 12); do
            ONLINE_SSM_IDS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" "Key=PingStatus,Values=Online" \
              --query "InstanceInformationList[].InstanceId" --output text 2>/dev/null || echo "")
            if echo "$ONLINE_SSM_IDS" | grep -qw "$INSTANCE_ID"; then
              SSM_ONLINE=true
              echo "Instance $INSTANCE_ID is online in AWS Systems Manager."
              break
            fi
            echo "Waiting for SSM Agent on $INSTANCE_ID to report Online (attempt $i/12)..."
            sleep 5
          done

          if [ "$SSM_ONLINE" = true ]; then
            COMMAND_ID=$(aws ssm send-command \
              --document-name "AWS-RunShellScript" \
              --instance-ids "$INSTANCE_ID" \
              --comment "assignment-shuttle-bus-ticketing db seed" \
              --parameters '{"commands":[
                "aws s3 cp s3://${{ env.SCHEMA_BUCKET }}/${{ env.SCRIPT_KEY }} /tmp/seed-db.sh",
                "chmod +x /tmp/seed-db.sh",
                "AWS_REGION=${{ env.AWS_REGION }} /tmp/seed-db.sh s3://${{ env.SCHEMA_BUCKET }}/${{ env.SCHEMA_KEY }} ${{ env.SCHEMA_BUCKET }}"
              ]}' \
              --query "Command.CommandId" --output text)

            aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          else
            echo "Notice: Instance $INSTANCE_ID is running but SSM Agent is not online yet."
            echo "The database will be automatically seeded by EC2 user-data on boot and by config.php on first request."
          fi
