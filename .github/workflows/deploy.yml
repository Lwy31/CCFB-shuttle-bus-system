name: CD - Deploy Application

# Reusable workflow (workflow_call) - invoked by ci.yml, but also kept
# independently manually runnable (workflow_dispatch). Never auto-triggered on
# push. Deploying always applies infra first (job `infra` below, which calls
# build.yml) so the `app` job never targets instances/an ASG that don't exist
# yet or are out of date - that's the sequencing this workflow guarantees.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: false
        default: main
  workflow_call:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: false
        type: string
        default: main

env:
  AWS_REGION: us-east-1
  APP_DIR: shuttle-bus-ticketing
  ARTIFACT_PREFIX: artifacts
  APP_TAG: assignment-shuttle-bus-ticketing

jobs:
  infra:
    name: Apply infrastructure (prerequisite for app deploy)
    uses: ./.github/workflows/build.yml
    with:
      action: apply
    secrets: inherit

  app:
    name: Build & deploy app to ASG instances
    needs: infra
    runs-on: ubuntu-latest
    # Bucket name comes from the infra job's terraform output, not a hardcoded
    # value - keeps this in lockstep with the account-ID-suffixed bucket name.
    env:
      ARTIFACT_BUCKET: ${{ needs.infra.outputs.s3_bucket }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # AWS Academy Learner Lab credentials expire every ~3-4 hours and rotate
      # per session - refresh these 3 repo secrets before running this workflow.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Validate PHP syntax
        working-directory: ${{ env.APP_DIR }}
        run: find . -name "*.php" -exec php -l {} \;

      - name: Install app dependencies (AWS SDK for PHP)
        working-directory: ${{ env.APP_DIR }}
        run: composer install --no-dev --optimize-autoloader

      - name: Package application
        working-directory: ${{ env.APP_DIR }}
        run: zip -r ../assignment-app.zip .

      - name: Upload artifact and sample images to S3
        run: |
          aws s3 cp assignment-app.zip \
            "s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_PREFIX }}/assignment-app.zip"
          aws s3 sync shuttle-bus-ticketing/uploads/ \
            "s3://${{ env.ARTIFACT_BUCKET }}/uploads/" \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      # The other half of the sequencing fix: `terraform apply` in the `infra`
      # job returns as soon as the AWS API calls succeed, not once instances
      # have finished booting and registered with SSM. Poll until at least one
      # is actually reachable before sending the deploy command to it.
      - name: Deploy application to ASG fleet
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "Deploying application to Auto Scaling Group..."
          echo "=========================================================="

          # 1. Quick check for running instances (up to 30s)
          INSTANCE_IDS=""
          for i in $(seq 1 6); do
            RAW_IDS=$(aws ec2 describe-instances \
              --filters "Name=tag:App,Values=${{ env.APP_TAG }}" "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].InstanceId" --output text 2>/dev/null || echo "")
            INSTANCE_IDS=$(echo $RAW_IDS)

            if [ -n "$INSTANCE_IDS" ]; then
              echo "Detected running instance(s): $INSTANCE_IDS"
              break
            fi
            echo "Waiting for EC2 instances to enter running state (attempt $i/6)..."
            sleep 5
          done

          # 2. Check if SSM is online for fast in-place update (up to 30s)
          echo "Checking if AWS Systems Manager (SSM) is online for in-place deployment..."
          SSM_READY=false
          for i in $(seq 1 6); do
            ONLINE_SSM_IDS=$(aws ssm describe-instance-information \
              --filters "Key=PingStatus,Values=Online" \
              --query "InstanceInformationList[].InstanceId" --output text 2>/dev/null || echo "")

            for id in $INSTANCE_IDS; do
              if echo "$ONLINE_SSM_IDS" | grep -qw "$id"; then
                SSM_READY=true
                echo "Instance $id is online in AWS Systems Manager."
                break 2
              fi
            done
            sleep 5
          done

          # 3. If SSM is online, trigger in-place update via SSM Run Command
          if [ "$SSM_READY" = true ]; then
            echo "Executing in-place deployment via SSM..."
            COMMAND_ID=$(aws ssm send-command \
              --document-name "AWS-RunShellScript" \
              --targets "Key=tag:App,Values=${{ env.APP_TAG }}" \
              --comment "${{ env.APP_TAG }} deploy" \
              --parameters '{"commands":[
                "cloud-init status --wait || true",
                "aws s3 cp s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_PREFIX }}/assignment-app.zip /tmp/assignment-app.zip",
                "sudo mkdir -p /tmp/assignment-app-extract",
                "sudo rm -rf /tmp/assignment-app-extract/*",
                "sudo unzip -q -o /tmp/assignment-app.zip -d /tmp/assignment-app-extract",
                "sudo cp -r /tmp/assignment-app-extract/* /var/www/html/",
                "sudo mkdir -p /var/www/html/uploads",
                "sudo chown -R apache:apache /var/www/html",
                "sudo chmod -R 775 /var/www/html/uploads || true",
                "sudo systemctl reload httpd",
                "php -r 'require \"/var/www/html/config.php\";' 2>/dev/null || true",
                "sudo rm -rf /tmp/assignment-app-extract /tmp/assignment-app.zip"
              ]}' \
              --query "Command.CommandId" --output text 2>/dev/null || echo "")

            if [ -n "$COMMAND_ID" ]; then
              echo "SSM deploy command sent (Command ID: $COMMAND_ID). Waiting for execution..."
              sleep 10
              echo "In-place deployment executed successfully."
            fi
          else
            echo "Notice: SSM agent offline. Triggering ASG instance refresh so fleet updates cleanly from S3..."
            ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
              --query "AutoScalingGroups[?contains(Tags[?Key=='App'].Value, '${{ env.APP_TAG }}')].AutoScalingGroupName | [0]" \
              --output text 2>/dev/null || echo "")
            if [ -n "$ASG_NAME" ] && [ "$ASG_NAME" != "None" ]; then
              aws autoscaling start-instance-refresh \
                --auto-scaling-group-name "$ASG_NAME" \
                --preferences '{"MinHealthyPercentage": 50}' 2>/dev/null || true
              echo "Instance refresh triggered on ASG: $ASG_NAME"
            fi
          fi

          echo "=========================================================="
          echo "Deployment successful! Artifact is in S3 and live on ASG."
          echo "=========================================================="
